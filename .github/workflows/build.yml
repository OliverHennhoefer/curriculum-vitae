name: Build documents

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and inspect PDFs
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y poppler-utils
            tlmgr install sourcesanspro roboto
            mkdir -p build
            for document in curriculum-vitae cover-letter; do
              mkdir -p "build/$document"
              latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -auxdir="build/$document" "$document.tex"
            done
            python3 tools/check_ats.py build

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v6
        with:
          name: cv-documents
          path: build/*.pdf

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download generated PDFs
        uses: actions/download-artifact@v7
        with:
          name: cv-documents
          path: build

      - name: Copy PDFs to examples
        run: |
          mkdir -p examples
          cp build/*.pdf examples/

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/*.pdf
          if git diff --cached --quiet; then
            echo "Example PDFs are unchanged."
            exit 0
          fi
          git commit -m "ci: update example PDFs"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Remote branch moved; rebasing before retry $((attempt + 1))."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "Unable to push generated PDFs after multiple attempts."
          exit 1
